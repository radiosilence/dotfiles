[include]
path = delta.conf
path = diff.conf
path = lfs.conf
path = sign.conf
path = merge.conf

[push]
default = current
followTags = true
autoSetupRemote = true

[pull]
default = current
rebase = false
merge = true

[alias]
up = pull --rebase --autostash

[core]
attributesfile = ~/.dotfiles/git.d/attributes
excludesFile = ~/.dotfiles/git.d/ignore

[init]
defaultBranch = main
