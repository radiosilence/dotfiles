pre-commit:
  parallel: true
  commands:
    rubocop:
      glob: "{*.{rb,ru,rake,gemspec,podspec,jbuilder,rabl,thor},Brewfile,Gemfile,Rakefile,Guardfile,Vagrantfile,Capfile,Thorfile,Fastfile,Appfile,Deliverfile,Matchfile,Scanfile,Snapfile,Gymfile}"
      run: |
        if [ -f Gemfile ] || [ -d .bundle ]; then
          bundle exec rubocop --force-exclusion --autocorrect {staged_files}
        elif command -v rubocop >/dev/null 2>&1; then
          rubocop --force-exclusion --autocorrect {staged_files}
        else
          echo "RuboCop not available, skipping"
          exit 0
        fi
      stage_fixed: true

    shfmt:
      glob: "*.{sh,bash}"
      run: |
        if command -v shfmt >/dev/null 2>&1; then
          shfmt -w -s -i 2 {staged_files}
        else
          echo "shfmt not available, skipping"
          exit 0
        fi
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    # The scripts have no shebang-driven extension, so glob on the directory.
    zsh-syntax:
      glob: "{scripts/**,zsh-plugins/**}"
      run: |
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          head -1 "$f" | grep -q 'zsh' || case "$f" in *.zsh) ;; *) continue ;; esac
          zsh -n "$f" || exit 1
        done

    # A completion that no longer parses is the failure mode zarg exists to
    # prevent, so prove all three shells still accept what it emits.
    completions:
      glob: "{scripts/**,zsh-plugins/zarg/**}"
      run: zsh-plugins/zarg/check-completions.zsh
