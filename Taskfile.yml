# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

output: prefixed
silent: true
run: once

vars:
  DOTFILES: "{{.ROOT_DIR}}"
  OP_SOCK: "$HOME/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"
  OK: '\033[32m󰄬\033[0m'
  WARN: '\033[33m\033[0m'
  FAIL: '\033[31m󰅖\033[0m'
  LINK: '\033[32m󰌷\033[0m'
  BOLD: '\033[1m'
  RESET: '\033[0m'

env:
  CLICOLOR_FORCE: "1"
  FORCE_COLOR: "1"

# setup-macos and setup-linux own everything interactive or root-owned that a
# fresh machine needs first: Xcode tools, Touch ID sudo, Homebrew, gh auth, the
# 1Password agent, the clone itself, and mise with task. This file assumes
# those exist and keeps the machine current. brew and mise are the only slow
# steps and run concurrently; everything else is a one-shot guarded by status.
#
# Nothing here asks for root on Linux: `upd` runs unattended there. os:upgrade
# is for running by hand.

tasks:
  converge:
    desc: Update everything and bring the machine to the state in this repo
    deps:
      - link
      - brew
      - mise
      - completions
      - secrets
      - git:signing
      - use-ssh
      - sudo:reattach
      - sudo:timeout
      - rosetta
      - claude
    cmds:
      - rm -f ~/.cache/zsh/eval/*.zsh ~/.cache/zsh/eval/*.zwc ~/.config/zsh/conf.d/*.zwc ~/.zcompdump
      - |
        if command -v sheldon >/dev/null && ! sheldon source >/dev/null 2>&1; then
          printf "{{.WARN}} sheldon source failed\n"
        fi
      - printf "{{.OK}} {{.BOLD}}converged{{.RESET}} (restart shell for changes)\n"

  link:
    desc: Point ~ at the configs in this repo
    cmds:
      - |
        d="{{.DOTFILES}}"
        ln_s() {
          [ -e "$1" ] || return 0
          [ "$(readlink "$2")" = "$1" ] && return 0
          mkdir -p "$(dirname "$2")"
          rm -rf "$2"
          ln -s "$1" "$2"
          printf "{{.LINK}} %s\n" "${2#"$HOME"/}"
        }

        for f in "$d"/.*; do
          case "${f##*/}" in
            .|..|.git|.gitignore|.github|.vscode|.sonarlint|.editorconfig|\
            .codeowners-lsp|.ruby-lsp|.claude|.claude-work|.omp|.omp-personal|\
            .claude-personal) continue ;;
          esac
          ln_s "$f" "$HOME/${f##*/}"
        done

        # sift's config moved from config.d/beets; carry the per-machine file over.
        if [ -f "$d/config.d/beets/config.yaml" ] && [ ! -e "$d/config.d/sift/config.yaml" ]; then
          mv "$d/config.d/beets/config.yaml" "$d/config.d/sift/config.yaml"
        fi
        rmdir "$d/config.d/beets" 2>/dev/null || true
        if [ -L "$HOME/.config/beets" ] && [ ! -e "$HOME/.config/beets" ]; then rm "$HOME/.config/beets"; fi

        # herdr keeps sockets and logs beside its config, and cargo reads
        # ~/.cargo rather than ~/.config/cargo, so both are linked per file below.
        for f in "$d"/config.d/*; do
          case "${f##*/}" in herdr|cargo) continue ;; esac
          ln_s "$f" "$HOME/.config/${f##*/}"
        done

        # A symlinked CARGO_HOME breaks crates that resolve paths against it
        # (askama via uniffi). Undo the earlier whole-directory link.
        if [ "$(readlink "$HOME/.cargo")" = "$d/config.d/cargo" ]; then
          rm "$HOME/.cargo"; mkdir "$HOME/.cargo"
          find "$d/config.d/cargo" -mindepth 1 -maxdepth 1 ! -name config.toml ! -name .gitignore -exec mv {} "$HOME/.cargo/" \;
          rm -f "$d/config.d/cargo/.gitignore"
        fi
        ln_s "$d/config.d/cargo/config.toml" "$HOME/.cargo/config.toml"

        # Agent profiles: config is versioned, runtime state and PII stay in ~.
        for p in \
          .claude-personal/CLAUDE.md \
          .claude-personal/settings.json \
          .claude-personal/skills \
          .claude-personal/hooks/push-before-test.sh \
          .claude-personal/hooks/op-service-account.sh \
          .claude-personal/hooks/reminders.sh \
          .claude-work/CLAUDE.md \
          .claude-work/skills \
          .claude-work/settings.json \
          .omp/agent/config.yml \
          .omp/agent/mcp.json \
          .omp-personal/agent/config.yml \
          .omp-personal/agent/mcp.json; do
          ln_s "$d/$p" "$HOME/$p"
        done
        ln_s "$d/config.d/herdr/config.toml" "$HOME/.config/herdr/config.toml"
        ln_s "$d/config.d/herdr/claude-agent-state.sh" "$HOME/.claude-personal/hooks/herdr-agent-state.sh"
        ln_s "$d/config.d/herdr/claude-agent-state.sh" "$HOME/.claude-work/hooks/herdr-agent-state.sh"

        touch "$HOME/.gitconfig"
        if ! grep -q .dotfiles "$HOME/.gitconfig"; then
          printf '\n[include]\npath = ~/.dotfiles/git.d/core.conf\n' >> "$HOME/.gitconfig"
          printf "{{.OK}} gitconfig include\n"
        fi

        mkdir -p "$HOME/.ssh"
        [ -f "$HOME/.ssh/config" ] || install -m 600 /dev/null "$HOME/.ssh/config"
        if ! grep -q .dotfiles "$HOME/.ssh/config"; then
          printf '\nInclude ~/.dotfiles/ssh.d/*.conf\n' >> "$HOME/.ssh/config"
          printf "{{.OK}} ssh config include\n"
        fi

        if [ "$(uname)" = Darwin ]; then
          ln_s "$d/Brewfile" "$HOME/Brewfile"
          if ! grep -q 2BUA8C4S2C.com.1password "$HOME/.ssh/config"; then
            printf '\nHost *\n  IdentityAgent "~/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"\n' >> "$HOME/.ssh/config"
            printf "{{.OK}} 1password ssh agent\n"
          fi
        fi

  brew:
    desc: Update Homebrew and install or upgrade everything in the Brewfile
    platforms: [darwin]
    deps: [link]
    cmds:
      - |
        if [ ! -f "{{.DOTFILES}}/dotfiles-roles.yml" ]; then
          cp "{{.DOTFILES}}/dotfiles-roles.yml.template" "{{.DOTFILES}}/dotfiles-roles.yml"
          printf "{{.WARN}} copied dotfiles-roles.yml — edit to enable brew roles\n"
        fi
      - brew update --quiet
      - brew bundle --file="{{.DOTFILES}}/Brewfile" --verbose
      - brew cleanup &

  mise:
    desc: Install and upgrade mise tools
    deps: [link, uv]
    cmds:
      - |
        # mise reads gh's token; without it release lookups hit the anonymous rate limit.
        gh auth status >/dev/null 2>&1 || printf "{{.WARN}} gh is not authenticated (gh auth login)\n"
        # brew owns mise on macOS; the Linux installer puts it in ~/.local.
        case "$(command -v mise)" in "$HOME/.local/"*) mise self-update --yes ;; esac
        mise install
        mise up
        mise reshim

  # mise's pipx: backend runs through uv. Installing it here rather than
  # waiting on brew lets brew and mise run at the same time.
  uv:
    desc: Install uv
    status: ["command -v uv"]
    cmds:
      - |
        if command -v brew >/dev/null; then
          brew install --quiet uv
        else
          curl -LsSf https://astral.sh/uv/install.sh | sh
        fi
      - printf "{{.OK}} uv\n"

  completions:
    desc: Regenerate zsh completions
    # After brew and mise, so completions come from the upgraded binaries.
    deps: [brew, mise]
    vars:
      DIR: '{{.COMP_DIR | default (printf "%s/.config/zsh/completions" .HOME)}}'
    cmds:
      - |
        dir="{{.DIR}}"
        mkdir -p "$dir"
        gen() {
          new=$(mktemp)
          if eval "$2" > "$new" 2>/dev/null && [ -s "$new" ] && ! cmp -s "$new" "$1"; then
            mv "$new" "$1"
            printf "{{.OK}} %s\n" "${1##*/}"
          else
            rm -f "$new"
          fi
        }

        # A tool that isn't installed fails its command and is skipped.
        # scripts/ and the wt plugins are zarg scripts, whose completions come
        # from the same spec they parse flags with.
        while read -r tool cmd; do
          gen "$dir/_$tool" "$cmd" &
        done <<'EOF'
        argocd argocd completion zsh
        buf buf completion zsh
        dagger dagger completion zsh
        docker docker completion zsh
        glow glow completion zsh
        golangci-lint golangci-lint completion zsh
        gt gt completion zsh
        helm helm completion zsh
        herdr herdr completion zsh
        k9s k9s completion zsh
        kubecolor kubecolor completion zsh
        kubectl kubectl completion zsh
        lefthook lefthook completion zsh
        nano-web nano-web completion zsh
        op op completion zsh
        orbctl orbctl completion zsh
        procs procs completion zsh
        pulumi pulumi completion zsh
        sesh sesh completion zsh
        tilt tilt completion zsh
        watchwoman watchwoman completion zsh
        yq yq completion zsh
        aube aube completion zsh
        nr nr --completion-zsh
        gh gh completion -s zsh
        koan koan completions zsh
        codeowners-cli codeowners-cli completions zsh
        task task --completion zsh
        just just --completions zsh
        aws-vault aws-vault --completion-script-zsh
        rg rg --generate complete-zsh
        xh xh --generate complete-zsh
        pup pup completions zsh
        folk folk completions zsh
        tfl tfl completions zsh
        caldav caldav completions zsh
        fastmail fastmail completions zsh
        sift sift completions zsh
        bun bun completions zsh | sed '/zstyle .:completion:.*:bun.*format/d'
        deno deno completions zsh
        starship starship completions zsh
        sheldon sheldon completions --shell zsh
        bat bat --completion zsh
        delta delta --generate-completion zsh
        lsd cat "$(dirname "$(command -v lsd)")/autocomplete/_lsd"
        clean-dls clean-dls --completions zsh
        clean-exif clean-exif --completions zsh
        embed-art embed-art --completions zsh
        extract-exif-from-flac extract-exif-from-flac --completions zsh
        git-squash git-squash --completions zsh
        git-sync git-sync --completions zsh
        imp imp --completions zsh
        kill-port kill-port --completions zsh
        parallel-dl-extract parallel-dl-extract --completions zsh
        prune prune --completions zsh
        to-audio to-audio --completions zsh
        unfuck-xcode unfuck-xcode --completions zsh
        url2base64 url2base64 --completions zsh
        vimv vimv --completions zsh
        wtclean {{.DOTFILES}}/zsh-plugins/wt-core/bin/wtclean --completions zsh
        wt-list {{.DOTFILES}}/zsh-plugins/wt-core/bin/wt-list --completions zsh
        wt-preview {{.DOTFILES}}/zsh-plugins/wt-core/bin/wt-preview --completions zsh
        wt-picker {{.DOTFILES}}/zsh-plugins/wt-zellij/bin/wt-picker --completions zsh
        wt-shell {{.DOTFILES}}/zsh-plugins/wt-zellij/bin/wt-shell --completions zsh
        EOF
        # npm's completion is a script to source, not a compdef.
        gen "{{.DOTFILES}}/config.d/zsh/conf.d/npm-completion.zsh" "npm completion" &
        wait

  secrets:
    desc: Fill mise conf.d/secrets.toml from 1Password
    platforms: [darwin]
    deps: [brew, mise]
    vars:
      TMPL: "{{.DOTFILES}}/packager.d/mise-secrets.tmpl"
      LOCAL: "$HOME/.config/mise/conf.d/secrets.toml"
      KEYS: "grep -E '^[A-Z_][A-Z_0-9]* *=' {{.TMPL}} | cut -d= -f1 | tr -d ' '"
    status:
      - |
        [ -f "{{.LOCAL}}" ] || exit 1
        for key in $({{.KEYS}}); do
          v=$(yq -p toml -oy ".env.${key}" "{{.LOCAL}}" 2>/dev/null)
          { [ -z "$v" ] || [ "$v" = "null" ]; } && exit 1
        done
    cmds:
      - |
        [ -f "{{.LOCAL}}" ] || : > "{{.LOCAL}}"
        chmod 600 "{{.LOCAL}}"
        # yq -i sets each key in place, so a rerun never duplicates entries.
        resolved=$(mktemp)
        if ! op inject -i "{{.TMPL}}" > "$resolved"; then
          printf "{{.FAIL}} op inject failed (is op signed in?)\n"
          rm -f "$resolved"
          exit 1
        fi
        for key in $({{.KEYS}}); do
          val=$(yq -p toml -oy ".${key}" "$resolved" 2>/dev/null)
          { [ -z "$val" ] || [ "$val" = "null" ]; } && continue
          v="$val" yq -i -p toml -o toml ".env.${key} = strenv(v)" "{{.LOCAL}}"
          printf "{{.OK}} %s\n" "$key"
        done
        rm -f "$resolved"

  git:signing:
    desc: Point git identity and SSH commit signing at the 1Password key
    platforms: [darwin]
    # sign.conf sets format/program/gpgsign; the identity half is per-machine
    # and lives in ~/.gitconfig, read from 1Password so no key is in the repo.
    deps: [link, brew]
    status: ['test -n "$(git config --global user.signingkey)"']
    cmds:
      - |
        key=$(SSH_AUTH_SOCK="{{.OP_SOCK}}" ssh-add -L 2>/dev/null | grep -m1 '^ssh-ed25519')
        if [ -z "$key" ]; then
          printf "{{.FAIL}} no ed25519 key in the 1Password agent — enable the key for this vault\n"
          exit 1
        fi
        email=$(op account list --format=json | yq -oy '.[0].email')
        if [ -z "$email" ] || [ "$email" = "null" ]; then
          printf "{{.FAIL}} could not read account email from op\n"
          exit 1
        fi
        git config --global user.email "$email"
        git config --global user.signingkey "$key"
        git config --global tag.gpgsign true
        # git refuses to verify an SSH signature without a signers file.
        signers="$HOME/.config/git/allowed_signers"
        mkdir -p "$(dirname "$signers")"
        printf '%s %s\n' "$email" "$key" > "$signers"
        git config --global gpg.ssh.allowedSignersFile "$signers"
        printf "{{.OK}} git signing (%s)\n" "$email"

  use-ssh:
    desc: Switch the dotfiles remote from HTTPS to SSH
    # The key lives in the 1Password desktop agent, so headless Linux boxes
    # stay on HTTPS through gh's credential helper.
    platforms: [darwin]
    deps: [link]
    dir: "{{.DOTFILES}}"
    status: ['git remote get-url origin | grep -q "^git@"']
    cmds:
      - |
        if [ ! -S "{{.OP_SOCK}}" ]; then
          printf "{{.WARN}} 1Password SSH agent not running — staying on HTTPS\n"
          exit 0
        fi
        url=$(git remote get-url origin | sed -E 's|https://github.com/(.+)|git@github.com:\1|')
        git remote set-url origin "$url"
        printf "{{.OK}} remote switched to %s\n" "$url"

  sudo:reattach:
    desc: Let Touch ID sudo work inside detached terminal sessions
    platforms: [darwin]
    deps: [brew]
    status: ["grep -q pam_reattach /etc/pam.d/sudo_local 2>/dev/null"]
    cmds:
      - |
        # A sudo_local that references a missing module bricks sudo entirely,
        # and recovery means enabling the root user in Directory Utility.
        so="$(brew --prefix pam-reattach)/lib/pam/pam_reattach.so"
        if [ ! -f "$so" ]; then
          printf "{{.FAIL}} pam_reattach.so missing at %s — refusing to edit sudo_local\n" "$so"
          exit 1
        fi
        backup=$(mktemp)
        sudo cp /etc/pam.d/sudo_local "$backup"
        sudo sh -c "{ printf 'auth       optional       %s\n' '$so'; cat /etc/pam.d/sudo_local; } > /etc/pam.d/sudo_local.tmp && mv /etc/pam.d/sudo_local.tmp /etc/pam.d/sudo_local"
        if sudo -n true 2>&1 | grep -q "initialize PAM"; then
          printf "{{.FAIL}} sudo PAM broke after edit — reverting\n"
          sudo cp "$backup" /etc/pam.d/sudo_local
          rm -f "$backup"
          exit 1
        fi
        rm -f "$backup"
        printf "{{.OK}} sudo reattach\n"

  sudo:timeout:
    desc: Set the sudo timeout to 30 minutes
    platforms: [darwin]
    status: ["test -f /etc/sudoers.d/timeout"]
    cmds:
      - sudo sh -c 'echo "Defaults timestamp_timeout=30" > /etc/sudoers.d/timeout && chmod 0440 /etc/sudoers.d/timeout'
      - printf "{{.OK}} sudo timeout\n"

  rosetta:
    desc: Install Rosetta 2 on Apple Silicon
    platforms: [darwin]
    status: ["test $(uname -m) != arm64 || /usr/bin/pgrep -q oahd"]
    cmds:
      - /usr/sbin/softwareupdate --install-rosetta --agree-to-license
      - printf "{{.OK}} rosetta 2\n"

  claude:
    desc: Install Claude Code
    status: ["command -v claude"]
    cmds:
      - curl -fsSL https://claude.ai/install.sh | bash
      - printf "{{.OK}} claude code\n"

  os:upgrade:
    desc: Upgrade system packages on Linux (needs sudo; not part of converge)
    platforms: [linux]
    cmds:
      - |
        if command -v apt-get >/dev/null; then
          sudo apt-get update && sudo apt-get upgrade -y && sudo apt-get autoremove -y
        elif command -v dnf >/dev/null; then
          sudo dnf update -y
        fi
