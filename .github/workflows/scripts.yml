name: Scripts

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "zsh-plugins/**"
      - ".github/workflows/scripts.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "zsh-plugins/**"
      - ".github/workflows/scripts.yml"

jobs:
  check:
    name: Syntax and completions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # fish is here to actually parse what we emit for it. Without it the
      # fish check degrades to "the emitter didn't crash", which is not the
      # thing worth knowing.
      - name: Install shells
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish

      # Executables and .zsh sources only — these directories also hold READMEs.
      - name: Syntax
        run: |
          fail=0
          for f in scripts/* scripts/lib/* zsh-plugins/*/bin/* zsh-plugins/*/*.zsh; do
            [ -f "$f" ] || continue
            [ -x "$f" ] || case "$f" in *.zsh) ;; *) continue ;; esac
            zsh -n "$f" || { echo "syntax: $f"; fail=1; }
          done
          exit $fail

      # Every script is exercised through zarg here, so a spec that parses but
      # renders a broken completion fails the build rather than the shell.
      - name: Completions
        run: zsh scripts/lib/check-completions

  zarg:
    name: zarg behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Run zarg tests
        run: zsh zsh-plugins/zarg/test.zsh
