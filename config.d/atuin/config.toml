# Atuin — only deviations from defaults live here.
# Full reference: https://docs.atuin.sh/configuration/config/

# Compact list instead of the full-screen box — less jarring mid-flow
style = "compact"
inline_height = 20

# ctrl-r starts global (repo-scoped default hid everything imported without
# cwd context). workspaces stays on so ctrl-r can still cycle into repo scope.
workspaces = true
filter_mode = "global"

# Enter runs the selected command immediately (tab to edit first)
enter_accept = true

[ai]
enabled = true
