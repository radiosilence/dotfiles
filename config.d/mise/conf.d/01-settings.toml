[settings]
fetch_remote_versions_cache = "30m"
trusted_config_paths = ["~/workspace", "~/.dotfiles", "~/.config/mise"]
env_file = ".env"
jobs = 14
# mise exports RUSTUP_TOOLCHAIN, which overrides rust-toolchain.toml; reading the
# file as a version source keeps a project's pin in charge.
idiomatic_version_file_enable_tools = ["rust"]

disable_backends = ["asdf", "ubi"]
activate_aggressive = true
# activate also puts shims ahead of /opt/homebrew/bin by default, so any command
# mise has installed but not activated here (brew's node, for one) runs through
# a shim that resolves the whole toolset before falling through.
activate_shims = false
minimum_release_age_excludes = [
  "aube",
  "deno",
  "koan",
  "mainlynorfolk",
  "tfl",
  "nano-web",
  "watchwoman",
  "fastmail",
  "codeowners-lsp",
  "caldav",
  "sift",
]

[settings.github]
credential_command = "gh auth token"
