[settings]
fetch_remote_versions_cache = "30m"
experimental = true
trusted_config_paths = ["~/workspace", "~/.dotfiles", "~/.config/mise"]
env_file = ".env"
jobs = 14
auto_install = true
not_found_auto_install = true

disable_backends = ["asdf", "ubi"]
activate_aggressive = true
minimum_release_age_excludes = [
  "aube",
  "deno",
  "koan",
  "mainlynorfolk",
  "tfl",
  "nano-web",
  "watchwoman",
  "fastmail",
  "codeowners-lsp",
  "caldav"
]

[settings.github]
credential_command = "gh auth token"
